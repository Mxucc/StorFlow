version: 2

before:
  hooks:
    - go mod tidy
    - chmod +x ./.build/build-assets.sh
    - ./.build/build-assets.sh {{.Version}}

builds:
  - env:
      - CGO_ENABLED=0

    binary: storflow

    ldflags:
      - -s -w
      - -X 'github.com/Mxucc/StorFlow/application/constants.BackendVersion={{.Tag}}' -X 'github.com/Mxucc/StorFlow/application/constants.LastCommit={{.ShortCommit}}'

    goos:
      - linux
      - windows
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm
      - arm64
      - loong64

    goarm:
      - 5
      - 6
      - 7

    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      storflow_{{.Tag}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  name_template: "{{.Version}}"

# 镜像不在这里构建。
#
# Docker 镜像（ghcr.io/mxucc/storflow 与 ghcr.io/mxucc/storflow-site）统一由
# .github/workflows/docker.yml 产出：它先在 runner 上编好二进制，再用
# Dockerfile 打包，前后端两条流水线互不干扰，也不需要在这里配置 registry 凭据。
#
# 这里只负责发布多平台二进制与 Release。
